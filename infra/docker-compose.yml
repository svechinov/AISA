services:
  postgres:
    image: postgres:16
    container_name: ai_biz_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_biz_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai_biz_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai_biz_backend
    # Inject keys from host backend/.env (create from backend/.env.example). Path is relative to this compose file.
    env_file:
      - path: ../backend/.env
        required: false
    # To write GOOGLE_REFRESH_TOKEN back into host backend/.env, use an extra compose file (see docker-compose.bind-env.yml).
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_biz_os
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

# Same-origin UI+API for the server deployment. Needed so the UI works from any device (phone via
# Tailscale) — the earlier setup relied on the browser reaching 127.0.0.1:8000 directly, which only
# works when the SSH tunnel forwards both ports on localhost. Here nginx proxies /api/* to the
# backend container over the compose network, so the browser only ever talks to one origin.
server {
    listen 80;
    server_name _;

    # nginx default is 1m; asset uploads (CDN_UPLOAD_MAX_BYTES_MB, default 50) go through this
    # proxy now that the UI is same-origin — without this, uploads over 1MB get a 413 here,
    # before the backend's own size check ever runs.
    client_max_body_size 60m;

    location /api/ {
        # Trailing slash on both sides strips the /api prefix before it reaches the backend
        # (backend routes are unprefixed; AuthMiddleware also accepts a leading /api and strips it,
        # but stripping here keeps things simple and avoids a double-strip).
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running requests (e.g. POST /runs/:id/restart) can take minutes — match the
        # frontend's own dev-proxy timeout (vite.config.js apiProxyTimeoutMs).
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
